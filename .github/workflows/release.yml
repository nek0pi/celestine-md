# Build and publish CelestineMD binaries for Linux, macOS, and Windows.
# Trigger: push a tag like v0.1.0
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.3.4)"
        required: true
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: celestine-linux-x86_64
            ext: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: celestine-macos-x86_64
            ext: ""
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: celestine-macos-aarch64
            ext: ""
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: celestine-windows-x86_64
            ext: ".exe"
            # Native host build on the Windows runner (avoids cross quirks).
            native: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Tag $RELEASE_TAG does not match Cargo version $VERSION"
            exit 1
          }

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release (cross / explicit target)
        if: matrix.native != true
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo build -p celestine-app --release --locked --target ${{ matrix.target }}

      - name: Build release (Windows native)
        if: matrix.native == true
        env:
          # Short paths avoid MAX_PATH link failures with deep crate trees.
          CARGO_TARGET_DIR: C:/c/target
        run: cargo build -p celestine-app --release --locked

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="$RELEASE_TAG"
          STAGE="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGE/bin" "$STAGE/share/celestine/themes" "$STAGE/share/celestine/config" \
                   "$STAGE/share/applications" "$STAGE/share/icons/hicolor/scalable/apps"
          BIN="target/${{ matrix.target }}/release/celestine${{ matrix.ext }}"
          install -m755 "$BIN" "$STAGE/bin/celestine"
          mkdir -p "$STAGE/share/celestine/licenses"
          cp assets/fonts/JetBrainsMono-OFL.txt "$STAGE/share/celestine/licenses/"
          cp -a themes/*.css "$STAGE/share/celestine/themes/"
          cp -a config/keybindings.*.toml "$STAGE/share/celestine/config/"
          cp packaging/celestine.desktop "$STAGE/share/applications/"
          cp assets/icon/celestine.svg "$STAGE/share/icons/hicolor/scalable/apps/celestine.svg"
          for sz in 16 24 32 48 64 128 256 512; do
            if [[ -f "assets/icon/celestine-${sz}.png" ]]; then
              mkdir -p "$STAGE/share/icons/hicolor/${sz}x${sz}/apps"
              cp "assets/icon/celestine-${sz}.png" "$STAGE/share/icons/hicolor/${sz}x${sz}/apps/celestine.png"
            fi
          done
          cp packaging/release-bundle-install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"
          cat > "$STAGE/README.txt" <<EOF
          CelestineMD ${VER} (${{ matrix.artifact }})
          https://github.com/nek0pi/celestine-md

          Quick start:
            ./bin/celestine /path/to/vault

          User install (binary + desktop + icons + themes → ~/.local):
            ./install.sh

          Themes also live under share/celestine/themes (and ~/.local/share/celestine/themes).
          EOF
          (
            cd dist
            tar -czf "${{ matrix.artifact }}-${VER}.tar.gz" "${{ matrix.artifact }}"
          )
          ls -la dist/

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="$RELEASE_TAG"
          STAGE="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGE" "$STAGE/themes" "$STAGE/config"
          # Native Windows build (CARGO_TARGET_DIR override or default).
          if [[ -f "C:/c/target/release/celestine.exe" ]]; then
            cp "C:/c/target/release/celestine.exe" "$STAGE/"
          elif [[ -f target/release/celestine.exe ]]; then
            cp target/release/celestine.exe "$STAGE/"
          else
            cp "target/${{ matrix.target }}/release/celestine.exe" "$STAGE/"
          fi
          mkdir -p "$STAGE/licenses"
          cp assets/fonts/JetBrainsMono-OFL.txt "$STAGE/licenses/"
          cp themes/*.css "$STAGE/themes/"
          cp config/keybindings.*.toml "$STAGE/config/"
          cat > "$STAGE/README.txt" <<EOF
          CelestineMD ${VER} (Windows x86_64)
          https://github.com/nek0pi/celestine-md

          Run:  celestine.exe path\to\vault
          Place themes next to the exe under themes\, or under %LOCALAPPDATA%\celestine\themes
          EOF
          (
            cd dist
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "${{ matrix.artifact }}-${VER}.zip" "${{ matrix.artifact }}"
            else
              powershell -Command "Compress-Archive -Path '${{ matrix.artifact }}' -DestinationPath '${{ matrix.artifact }}-${VER}.zip'"
            fi
          )
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # Publish only after every supported platform has built successfully.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} release-assets/ \;
          for platform in linux-x86_64 macos-aarch64 macos-x86_64; do
            test -s "release-assets/celestine-${platform}-${RELEASE_TAG}.tar.gz"
          done
          test -s "release-assets/celestine-windows-x86_64-${RELEASE_TAG}.zip"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
