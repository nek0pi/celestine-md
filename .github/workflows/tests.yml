name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test workspace (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee test-output.log

      - name: Test workspace (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Keep linker paths short with the workspace's dependency tree.
          CARGO_TARGET_DIR: C:/c/target
        run: cargo test --workspace --locked 2>&1 | tee test-output.log

      - name: Report test failure details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          log = Path("test-output.log")
          if log.exists():
              # Expose the failure summary in check annotations as well as logs.
              # This also permits diagnosis using the public GitHub API.
              message = "\n".join(log.read_text(errors="replace").splitlines()[-100:])[-12000:]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Workspace test failure::{message}")
