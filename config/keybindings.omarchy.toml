# CelestineMD — Omarchy-friendly profile (Ctrl mirrors Super intents; never binds Super)
profile = "omarchy"

[bindings]
quick_open = "Mod+O"
command_palette = "Mod+P"
graph = "Mod+G"
close_tab = "Mod+W"
new_note = "Mod+N"
new_canvas = "Mod+Shift+C"
save = "Mod+S"
toggle_preview = "Mod+E"
find = "Mod+F"
vault_search = "Mod+Shift+F"
settings = "Mod+,"
quit = "Mod+Q"
shortcuts = "?"
shortcuts_editor = "Mod+/"
theme_picker = "Mod+T"
open_vault = "Mod+Shift+O"
recent_vaults = "Mod+R"
close_vault = "Mod+Shift+W"
font_bigger = "Mod+="
font_smaller = "Mod+-"
font_reset = "Mod+0"
next_tab = "Alt+Right"
prev_tab = "Alt+Left"
former_tab = "Ctrl+Alt+Tab"
focus_files = "Ctrl+Tab"
focus_outline = "Ctrl+Shift+O"
next_pane = "Ctrl+Alt+Right"
prev_pane = "Ctrl+Alt+Left"
rename = "F2"
new_folder = "Mod+Shift+N"
delete_item = "Delete"
toggle_left_sidebar = "Mod+B"
toggle_right_sidebar = "Mod+\\"
nav_back = "Mod+["
nav_forward = "Mod+]"
reveal_in_tree = "Mod+Shift+E"
tab_1 = "Ctrl+1"
tab_2 = "Ctrl+2"
tab_3 = "Ctrl+3"
tab_4 = "Ctrl+4"
tab_5 = "Ctrl+5"
tab_6 = "Ctrl+6"
tab_7 = "Ctrl+7"
tab_8 = "Ctrl+8"
tab_9 = "Ctrl+9"
escape = "Escape"
