# CelestineMD — Obsidian-like profile (Mod = Ctrl on Win/Linux, Cmd on macOS)
profile = "obsidian"

[bindings]
quick_open = "Mod+O"
command_palette = "Mod+P"
graph = "Mod+G"
close_tab = "Mod+W"
new_note = "Mod+N"
new_canvas = "Mod+Shift+C"
save = "Mod+S"
toggle_preview = "Mod+E"
find = "Mod+F"
vault_search = "Mod+Shift+F"
settings = "Mod+,"
quit = "Mod+Q"
shortcuts = "?"
shortcuts_editor = "Mod+/"
theme_picker = "Mod+T"
open_vault = "Mod+Shift+O"
recent_vaults = "Mod+R"
close_vault = "Mod+Shift+W"
font_bigger = "Mod+="
font_smaller = "Mod+-"
font_reset = "Mod+0"
next_tab = "Alt+Right"
prev_tab = "Alt+Left"
focus_files = "Ctrl+Tab"
rename = "F2"
new_folder = "Mod+Shift+N"
delete_item = "Delete"
toggle_left_sidebar = "Mod+B"
toggle_right_sidebar = "Mod+\\"
nav_back = "Mod+["
nav_forward = "Mod+]"
reveal_in_tree = "Mod+Shift+E"
escape = "Escape"
