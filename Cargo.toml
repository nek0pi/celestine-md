[workspace]
resolver = "2"
members = [
    "crates/celestine-core",
    "crates/celestine-theme",
    "crates/celestine-app",
    "vendor/notify",
]
default-members = ["crates/celestine-app"]

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "MIT"
authors = ["CelestineMD contributors"]
repository = "https://github.com/nek0pi/celestine-md"

[workspace.dependencies]
celestine-core = { path = "crates/celestine-core" }
celestine-theme = { path = "crates/celestine-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
walkdir = "2"
notify = "7"
petgraph = "0.7"
regex = "1"
pulldown-cmark = "0.12"
fuzzy-matcher = "0.3"
directories = "5"
# Lightweight HTTP for GitHub release checks (native-tls avoids rustls/ring).
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
# Glow-only: eframe's default also enables wgpu, which pulls wgpu-hal/D3D12 and
# often fails to compile on Windows MSVC (windows crate version clashes).
# system_fonts enables color emoji via the platform emoji font.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
# Skip `http` loader (ehttp/rustls/ring) — vault images are local files.
egui_extras = { version = "0.37", features = ["file", "image", "svg", "gif", "webp"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
emojis = "0.6"

[patch.crates-io]
notify = { path = "vendor/notify" }
